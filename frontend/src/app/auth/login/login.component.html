<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Connexion</mat-card-title>
      <mat-card-subtitle>Connectez-vous à votre espace</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput 
                 type="email" 
                 formControlName="email"
                 placeholder="utilisateur@admin / @rh / @employe">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error>{{ getEmailErrorMessage() }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <input matInput 
                 [type]="hidePassword ? 'password' : 'text'"
                 formControlName="password">
          <button mat-icon-button 
                  matSuffix 
                  type="button"
                  (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>{{ getPasswordErrorMessage() }}</mat-error>
        </mat-form-field>

        <div class="login-actions">
          <button mat-raised-button 
                  color="primary" 
                  type="submit"
                  [disabled]="!loginForm.valid || isLoading"
                  class="login-button">
            <mat-icon [style.display]="isLoading ? 'inline' : 'none'">hourglass_empty</mat-icon>
            <span [style.display]="!isLoading ? 'inline' : 'none'">Se connecter</span>
            <span [style.display]="isLoading ? 'inline' : 'none'">Connexion...</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
