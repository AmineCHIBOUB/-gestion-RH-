<div class="department-form-container">
  <h2 mat-dialog-title>{{isEditMode ? 'Modifier' : 'Créer'}} un Département</h2>
  
  <form [formGroup]="departmentForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nom du département</mat-label>
          <input matInput formControlName="name" placeholder="Entrez le nom du département">
          <mat-error *ngIf="departmentForm.get('name')?.hasError('required')">
            Le nom est requis
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="3" placeholder="Description du département"></textarea>
          <mat-error *ngIf="departmentForm.get('description')?.hasError('required')">
            La description est requise
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Code du département</mat-label>
          <input matInput formControlName="code" placeholder="Code du département">
        </mat-form-field>
      </div>
      
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancel()" [disabled]="loading">
        Annuler
      </button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!departmentForm.valid || loading">
        <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
        {{isEditMode ? 'Mettre à jour' : 'Créer'}}
      </button>
    </mat-dialog-actions>
  </form>
</div>
