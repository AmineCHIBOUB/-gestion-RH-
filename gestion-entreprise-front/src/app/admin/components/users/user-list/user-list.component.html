<div class="user-list-container">
  <div class="header">
    <h2>Gestion des Utilisateurs</h2>
    <button mat-raised-button color="primary" (click)="openUserForm()">
      <mat-icon>add</mat-icon>
      Nouvel Utilisateur
    </button>
  </div>

  <div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Rechercher</mat-label>
      <input matInput [(ngModel)]="searchTerm" placeholder="Nom ou email...">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-container" *ngIf="!loading">
    <table mat-table [dataSource]="filteredUsers" class="users-table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let user">{{user.id}}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let user">{{user.firstName}} {{user.lastName}}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{user.email}}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rôle</th>
        <td mat-cell *matCellDef="let user">
          <mat-chip [color]="user.role === 'admin' ? 'primary' : user.role === 'rh' ? 'accent' : 'warn'">
            {{user.role | titlecase}}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Statut</th>
        <td mat-cell *matCellDef="let user">
          <mat-slide-toggle 
            [checked]="user.status === 'active'"
            (change)="toggleUserStatus(user)"
            [disabled]="loading">
          </mat-slide-toggle>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button (click)="openUserForm(user)" matTooltip="Modifier">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteUser(user)" matTooltip="Supprimer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <div class="loading-container" *ngIf="loading">
    <mat-spinner></mat-spinner>
    <p>Chargement des utilisateurs...</p>
  </div>

  <div class="no-data" *ngIf="!loading && filteredUsers.length === 0">
    <mat-icon>person_off</mat-icon>
    <p>Aucun utilisateur trouvé</p>
  </div>
</div>
